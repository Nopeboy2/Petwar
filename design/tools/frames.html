<!doctype html><meta charset="utf-8">
<!-- Khung ô túi đồ theo 5 độ hiếm (data/items.js RARITY), từ ảnh gốc nền trắng design/source/slot_item_<n>_raw.png:
     1 Thường (nâu) · 2 Khá = khung Hiếm đổi sang xanh lá · 3 Hiếm (xanh dương) · 4 Sử thi (tím) · 5 Huyền thoại (vàng, có quầng sáng).
     Nền trắng nối từ mép ảnh → trong suốt kiểu "color to alpha" (giữ quầng sáng + mép mịn), điểm xám ít bão hoà (bóng đổ) → trong suốt hẳn; lòng khung giữ đặc.
     Thân khung (alpha > 0.9) kéo vào CÙNG vùng x 8–184, y 20–179 của ảnh 192×192 như slot4.html cũ → khớp slot_sel và tâm ảnh vật phẩm.
     Chạy: node design/tools/extract.mjs frames.html assets/bag-ui -->
<pre id="out"></pre>
<script>
const JOBS = [['slot_item_1', 1, ''], ['slot_item_2', 3, 'hue-rotate(-95deg) saturate(1.3)'], ['slot_item_3', 3, ''], ['slot_item_4', 4, ''], ['slot_item_5', 5, '']];
const load = n => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = `../source/slot_item_${n}_raw.png`; });
function cut(img) {
  const w = img.width, h = img.height, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, w, h), p = d.data, seen = new Uint8Array(w * h), st = [];
  const al = i => Math.max(255 - p[i * 4], 255 - p[i * 4 + 1], 255 - p[i * 4 + 2]) / 255; // độ đục nếu coi nền là trắng
  for (let i = 0; i < w; i++) st.push(i, (h - 1) * w + i);
  for (let j = 0; j < h; j++) st.push(j * w, j * w + w - 1);
  while (st.length) { const i = st.pop(); if (seen[i] || al(i) > 0.75) continue; seen[i] = 1;
    const x = i % w, y = (i / w) | 0; if (x > 0) st.push(i - 1); if (x < w - 1) st.push(i + 1); if (y > 0) st.push(i - w); if (y < h - 1) st.push(i + w); }
  for (let i = 0; i < w * h; i++) {
    if (!seen[i]) continue;
    const k = i * 4, r = p[k], gg = p[k + 1], b = p[k + 2], a = al(i);
    if (Math.max(r, gg, b) - Math.min(r, gg, b) < 25 || a < 0.02) { p[k + 3] = 0; continue; } // trắng / bóng xám → bỏ
    for (let j = 0; j < 3; j++) p[k + j] = Math.max(0, Math.min(255, Math.round((p[k + j] - 255 * (1 - a)) / a)));
    p[k + 3] = Math.round(255 * a);
  }
  g.putImageData(d, 0, 0);
  return c;
}
(async () => {
  const out = {}, cache = {};
  for (const [name, n, filter] of JOBS) {
    const src = cache[n] || (cache[n] = cut(await load(n)));
    const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    const g = c.getContext('2d'); if (filter) g.filter = filter; g.drawImage(src, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data; let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 230) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const o = document.createElement('canvas'); o.width = o.height = 192; const og = o.getContext('2d'); og.imageSmoothingQuality = 'high';
    const sx = 176 / (x1 - x0 + 1), sy = 159 / (y1 - y0 + 1); // thân khung → vùng 176×159; quầng sáng (Huyền thoại) tràn ra lề theo cùng tỉ lệ
    og.drawImage(c, 8 - x0 * sx, 20 - y0 * sy, c.width * sx, c.height * sy);
    out[name] = o.toDataURL('image/webp', 0.92);
  }
  document.getElementById('out').textContent = JSON.stringify(out);
})();
</script>
