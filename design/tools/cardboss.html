<!doctype html><meta charset="utf-8">
<!-- Khung thẻ boss (design/briefs/04-boss.md): design/source/card_boss_raw.png nền trắng → WebP nền trong suốt, cắt sát mép, rộng 456px (3× của 152).
     Chạy: node design/tools/extract.mjs cardboss.html assets/boss-ui -->
<pre id="out"></pre>
<script>
const img = new Image();
img.onload = () => {
  const w = img.width, h = img.height, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, w, h), p = d.data, seen = new Uint8Array(w * h), st = [];
  const al = i => Math.max(255 - p[i * 4], 255 - p[i * 4 + 1], 255 - p[i * 4 + 2]) / 255; // độ đục nếu coi nền là trắng
  for (let i = 0; i < w; i++) st.push(i, (h - 1) * w + i);
  for (let j = 0; j < h; j++) st.push(j * w, j * w + w - 1);
  while (st.length) { const i = st.pop(); if (seen[i] || al(i) > 0.75) continue; seen[i] = 1;
    const x = i % w, y = (i / w) | 0; if (x > 0) st.push(i - 1); if (x < w - 1) st.push(i + 1); if (y > 0) st.push(i - w); if (y < h - 1) st.push(i + w); }
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let i = 0; i < w * h; i++) {
    const k = i * 4;
    if (seen[i]) {
      const a = al(i);
      if (Math.max(p[k], p[k + 1], p[k + 2]) - Math.min(p[k], p[k + 1], p[k + 2]) < 25 || a < 0.02) { p[k + 3] = 0; continue; }
      for (let j = 0; j < 3; j++) p[k + j] = Math.max(0, Math.min(255, Math.round((p[k + j] - 255 * (1 - a)) / a)));
      p[k + 3] = Math.round(255 * a);
    }
    if (p[k + 3] > 40) { const x = i % w, y = (i / w) | 0; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  }
  g.putImageData(d, 0, 0);
  const s = 456 / (x1 - x0 + 1), o = document.createElement('canvas'); o.width = 456; o.height = Math.round((y1 - y0 + 1) * s);
  const og = o.getContext('2d'); og.imageSmoothingQuality = 'high'; og.drawImage(c, x0, y0, x1 - x0 + 1, y1 - y0 + 1, 0, 0, o.width, o.height);
  document.getElementById('out').textContent = JSON.stringify({ card_boss: o.toDataURL('image/webp', 0.92) });
};
img.src = '../source/card_boss_raw.png';
</script>
